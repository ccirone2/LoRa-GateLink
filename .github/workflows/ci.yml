name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request cancels its older run; runs on main always finish (the release evidence check
# and the Pages deploy read them).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# `shell: bash` adds pipefail, so a compile error piped through tee still fails the step.
defaults:
  run:
    shell: bash

# Actions are pinned to a full commit SHA (its tag in the comment) and Dependabot (.github/dependabot.yml) proposes
# updates. Runner images are pinned too, so an image change is a reviewed edit rather than a surprise.
jobs:
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: arduino/setup-arduino-cli@81d310742121c928ea9c8bbd407b4217b432ae02 # v2.0.0
      # Versions: keep in sync with docs/development.md, release.yml and tools/agent/cloud_setup.sh
      # (tests/tools/test_agent_tooling.py checks they agree). The cache key names them all.
      - name: Cache cores and libraries
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.arduino15
            ~/Arduino/libraries
          key: arduino-samd1.8.14-avr1.8.8-LoRa0.8.0-Crypto0.4.0-FlashStorage1.0.0-ArduinoJson7.4.3-SleepyDog1.8.4
      - name: Install cores and libraries
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:samd@1.8.14 arduino:avr@1.8.8
          arduino-cli lib install "LoRa@0.8.0" "Crypto@0.4.0" "FlashStorage@1.0.0" "ArduinoJson@7.4.3" \
            "Adafruit SleepyDog Library@1.8.4"
      - name: Compile GateLink (no warnings in project files)
        run: |
          arduino-cli compile --fqbn arduino:samd:mkrwan1310 --warnings all firmware/GateLink 2>&1 | tee build.log
          ! grep -E "GateLink/[^:]+:[0-9]+:[0-9]+: warning" build.log
      - name: Size budget (tools/fw_size.py)
        run: python3 tools/fw_size.py build.log
      # link.cpp and config.cpp on the host, against the Crypto library installed above.
      - name: Host unit tests (tests/native)
        run: make -C tests/native CRYPTO="$HOME/Arduino/libraries/Crypto/src"
      - name: Compile GateSim (no warnings in project files)
        run: |
          arduino-cli compile --fqbn arduino:avr:uno --warnings all tools/GateSim 2>&1 | tee sim.log
          ! grep -E "GateSim/[^:]+:[0-9]+:[0-9]+: warning" sim.log

  # The web console: plain ES modules (no build step); the tooling is in package.json.
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Syntax check every module
        run: for f in web/app.js web/js/*.js; do node --check "$f"; done
      - name: Lint (eslint.config.js)
        run: npm run lint
      - name: Unit tests (tests/web/unit)
        run: npm run test:unit
      - name: Browser tests (tests/web/browser, Chromium against fake boards)
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: tests/web/report/

  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0  # the FW_VERSION check measures the branch from where it left its base
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/e2e/requirements.txt
      - name: Install the suite's dependencies and ruff
        run: pip install ruff==0.16.10 -r tests/e2e/requirements.txt
      - name: Byte-compile the e2e suite and tools
        run: python -m compileall -q tests tools
      - name: Lint (ruff.toml)
        run: ruff check tests tools
      - name: Unit tests for the tools and agent hooks (tests/tools)
        run: python -m pytest tests/tools -q
      # Catches import and fixture errors; no test runs (they need the bench).
      - name: Collect the e2e suite
        run: python -m pytest --collect-only -q -m "" tests/e2e
      - name: Firmware, suite and docs agree (enums, log events, console commands)
        run: python tools/check_contract.py
      # Every firmware change bumps FW_VERSION (docs/development.md): the stop hook asks, this enforces.
      - name: Firmware changes bump FW_VERSION
        if: github.event_name == 'pull_request'
        env:
          BASE: origin/${{ github.base_ref }}
        run: python tools/agent/hooks.py check --base "$BASE" --only fw-version

  # The workflows themselves: actionlint, which also runs shellcheck on every run: block.
  workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: actionlint
        run: |
          v=1.7.12
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tgz" \
            "https://github.com/rhysd/actionlint/releases/download/v$v/actionlint_${v}_linux_amd64.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tgz" |
            sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tgz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
