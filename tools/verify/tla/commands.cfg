\* model: GateLink
\* Commands through the attacker, with both boards rebooting: a command never pulses past its TTL (plus the gate's
\* slack) from the owner's switch, whatever the attacker withholds or replays, also across reboots (each boot's clock
\* starts elsewhere). Holds on the firmware as it is.
SPECIFICATION Spec
VIEW CmdView
CONSTANTS L = 3  TTL = 2  SLACK = 1  AHEAD = 3  STALE = 1  LAG = 4  MISSED = 1
          MaxTime = 4  MaxSeq = 4  MaxGateSeq = 4  MaxBoots = 2  MaxLeft = 2  MaxCmds = 1
          FixCmdOrder = FALSE  FixStatusAge = FALSE  FirstFresh = TRUE
INVARIANT TypeOK CmdFresh
