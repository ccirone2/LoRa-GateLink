name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request cancels its older run; runs on main always finish (the release evidence check
# and the Pages deploy read them).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# `shell: bash` adds pipefail, so a compile error piped through tee still fails the step.
defaults:
  run:
    shell: bash

# Actions are pinned to a full commit SHA (its tag in the comment) and Dependabot (.github/dependabot.yml) proposes
# updates. Runner images are pinned too, so an image change is a reviewed edit rather than a surprise.
jobs:
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # arduino-cli's version in full: the action takes the highest tag that starts with it, release candidates
      # included (its default, 1.x, took 1.5.2-rc.1).
      - uses: arduino/setup-arduino-cli@81d310742121c928ea9c8bbd407b4217b432ae02 # v2.0.0
        with:
          version: '1.5.1'
      # Versions: keep in sync with docs/development.md, release.yml and tools/agent/cloud_setup.sh
      # (tests/tools/test_agent_tooling.py checks they agree). The cache key names them all.
      - name: Cache cores and libraries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.arduino15
            ~/Arduino/libraries
          key: arduino-samd1.8.14-avr1.8.8-LoRa0.8.0-Crypto0.4.0-FlashStorage1.0.0-ArduinoJson7.4.3
      - name: Install cores and libraries
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:samd@1.8.14 arduino:avr@1.8.8
          arduino-cli lib install "LoRa@0.8.0" "Crypto@0.4.0" "FlashStorage@1.0.0" "ArduinoJson@7.4.3"
      - name: Compile GateLink (no warnings in project files)
        run: |
          arduino-cli compile --fqbn arduino:samd:mkrwan1310 --warnings all firmware/GateLink 2>&1 | tee build.log
          ! grep -E "GateLink/[^:]+:[0-9]+:[0-9]+: warning" build.log
      - name: Size budget (tools/fw_size.py)
        run: python3 tools/fw_size.py build.log
      # link.cpp and config.cpp on the host, against the Crypto library installed above.
      - name: Host unit tests (tests/native)
        run: |
          make -C tests/native -j"$(nproc)" CRYPTO="$HOME/Arduino/libraries/Crypto/src" bins
          make -C tests/native CRYPTO="$HOME/Arduino/libraries/Crypto/src"
      - name: Compile GateSim (no warnings in project files)
        run: |
          arduino-cli compile --fqbn arduino:avr:uno --warnings all tools/GateSim 2>&1 | tee sim.log
          ! grep -E "GateSim/[^:]+:[0-9]+:[0-9]+: warning" sim.log

  # The firmware's own code, statically: cppcheck (warning, performance, portability) and clang-tidy (bug-finding
  # checks, firmware/GateLink/.clang-tidy), with the host build's flags (tests/native/Makefile).
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: arduino/setup-arduino-cli@81d310742121c928ea9c8bbd407b4217b432ae02 # v2.0.0
        with:
          version: '1.5.1'
      - name: Libraries the host build needs
        run: arduino-cli lib install "Crypto@0.4.0" "ArduinoJson@7.4.3"
      - name: Install cppcheck and clang-tidy (Ubuntu 24.04's)
        run: sudo apt-get update -q && sudo apt-get install -y -q cppcheck clang-tidy-18
      - name: cppcheck
        run: make -C tests/native cppcheck
      - name: clang-tidy
        run: make -C tests/native TIDY=clang-tidy-18 tidy

  # Formal verification (tools/verify, docs/architecture.md "Verification"): ESBMC proves the relay, command, sensor
  # and replay-window properties on the firmware's own C++ for runs of any length, and TLC checks the protocol model
  # with an attacker on the air. Versions: keep in step with tools/verify/docker/Dockerfile and docs/development.md
  # (tests/tools/test_verify.py checks they agree).
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install ESBMC and TLC
        run: |
          esbmc_version=8.5
          esbmc_sha256=d8da304dd0dfce6c9f488379f03a72e768bce8598c22478c980e1704247352f1
          tla_version=1.7.4
          tla_sha256=936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88
          curl -fsSL -o "$RUNNER_TEMP/esbmc.zip" \
            "https://github.com/esbmc/esbmc/releases/download/v$esbmc_version/esbmc-linux.zip"
          echo "$esbmc_sha256  $RUNNER_TEMP/esbmc.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/esbmc.zip" -d "$RUNNER_TEMP/esbmc"
          curl -fsSL -o "$RUNNER_TEMP/tla2tools.jar" \
            "https://github.com/tlaplus/tlaplus/releases/download/v$tla_version/tla2tools.jar"
          echo "$tla_sha256  $RUNNER_TEMP/tla2tools.jar" | sha256sum -c -
      - name: Proofs (make -C tools/verify)
        # Each ESBMC run's limit: a gate segment takes ~40 min alone, past 50 with the others alongside (-j).
        run: |
          make -C tools/verify -j"$(nproc)" ESBMC="$RUNNER_TEMP/esbmc/release/bin/esbmc" \
            TLA2TOOLS="$RUNNER_TEMP/tla2tools.jar" ESBMC_TIMEOUT=5400

  # How much of the firmware the host tests run (gcovr over a --coverage build); fails below MIN_LINES %.
  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: arduino/setup-arduino-cli@81d310742121c928ea9c8bbd407b4217b432ae02 # v2.0.0
        with:
          version: '1.5.1'
      - name: Libraries the host build needs
        run: arduino-cli lib install "Crypto@0.4.0" "ArduinoJson@7.4.3"
      - name: Install gcovr
        run: pip install gcovr==8.6
      - name: Coverage
        run: make -C tests/native -j"$(nproc)" coverage MIN_LINES=85
      - name: Report
        if: always()
        run: |
          { echo '### Firmware coverage by the host tests'; echo; echo '```'
            cat tests/native/build-cov/coverage.txt 2>/dev/null || echo "no report"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  # The web console: plain ES modules (no build step); the tooling is in package.json.
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Syntax check every module
        run: for f in web/app.js web/js/*.js; do node --check "$f"; done
      - name: Lint (eslint.config.js)
        run: npm run lint
      - name: Unit tests (tests/web/unit)
        run: npm run test:unit
      - name: Browser tests (tests/web/browser, Chromium against fake boards)
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: tests/web/report/

  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # the FW_VERSION check measures the branch from where it left its base
      # The Python environment is pyproject.toml + uv.lock (hashes); --locked fails if the lock is out of date.
      # uv's version: keep in step with pyproject.toml's required-version and tools/agent/cloud_setup.sh.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.12.24'
          python-version: '3.12'
          enable-cache: true
      - name: Install the locked environment (pyproject.toml, uv.lock)
        run: uv sync --locked
      - name: Byte-compile the e2e suite and tools
        run: uv run --frozen python -m compileall -q tests tools
      - name: Lint (ruff.toml)
        run: uv run --frozen ruff check tests tools
      - name: Unit tests for the tools and agent hooks (tests/tools)
        run: uv run --frozen pytest tests/tools -q
      # Catches import and fixture errors; no test runs (they need the bench).
      - name: Collect the e2e suite
        run: uv run --frozen pytest --collect-only -q -m "" tests/e2e
      - name: Firmware, suite and docs agree (enums, log events, console commands)
        run: uv run --frozen tools/check_contract.py
      # Generated tables current, hand-written reference docs and quoted values in step with the source. Reads the
      # web console's tables through node (on the runner image).
      - name: Reference docs from source (tools/docgen.py)
        run: uv run --frozen tools/docgen.py
      # Every firmware change bumps FW_VERSION (docs/development.md): the stop hook asks, this enforces.
      - name: Firmware changes bump FW_VERSION
        if: github.event_name == 'pull_request'
        env:
          BASE: origin/${{ github.base_ref }}
        run: uv run --frozen tools/agent/hooks.py check --base "$BASE" --only fw-version

  # The workflows themselves: actionlint, which also runs shellcheck on every run: block.
  workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: actionlint
        run: |
          v=1.7.12
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tgz" \
            "https://github.com/rhysd/actionlint/releases/download/v$v/actionlint_${v}_linux_amd64.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tgz" |
            sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tgz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
