\* model: GateLink
\* expect: SensorTruth violated
\* The bound of status_age.cfg is exact: one tick less (LAG = L + 2 STALE - 2), and the model finds a run that breaks it.
SPECIFICATION Spec
VIEW SensorView
CONSTANTS L = 3  TTL = 3  SLACK = 1  AHEAD = 4  STALE = 1  LAG = 3  MISSED = 1
          MaxTime = 8  MaxSeq = 4  MaxGateSeq = 4  MaxBoots = 2  MaxLeft = 2  MaxCmds = 0
          FixCmdOrder = TRUE  FixStatusAge = TRUE  FirstFresh = TRUE
INVARIANT TypeOK SensorTruth
