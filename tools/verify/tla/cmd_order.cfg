\* model: GateLink
\* The gate since 0.20.3 (FixCmdOrder): a command framed before the last one it took from the house session is refused.
\* With commands withheld, replayed, reordered and renumbered by the attacker, a command never pulses after a later one
\* was taken, nor twice, nor past its TTL. asis_order.cfg and asis_once.cfg show the model finds the bugs without it.
SPECIFICATION Spec
VIEW CmdView
CONSTANTS L = 3  TTL = 3  SLACK = 1  AHEAD = 4  STALE = 2  LAG = 4  MISSED = 1
          MaxTime = 4  MaxSeq = 6  MaxGateSeq = 3  MaxBoots = 1  MaxLeft = 2  MaxCmds = 2
          FixCmdOrder = TRUE  FixStatusAge = FALSE  FirstFresh = TRUE
INVARIANT TypeOK CmdOrder CmdOnce CmdFresh
