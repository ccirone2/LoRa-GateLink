\* model: GateLink
\* expect: SensorTruth violated
\* The residual (docs/architecture.md "Verification"): the first STATUS a house takes in a gate session, after either
\* board restarts, has no reckoning of the gate's clock to be dated against. An attacker who withholds STATUS from the
\* handshake on can deliver one late: the sensor shows that old state for up to the link timeout, after showing open
\* (link down) for as long as it withheld them.
SPECIFICATION Spec
VIEW SensorView
CONSTANTS L = 3  TTL = 3  SLACK = 1  AHEAD = 4  STALE = 1  LAG = 4  MISSED = 1
          MaxTime = 8  MaxSeq = 4  MaxGateSeq = 4  MaxBoots = 2  MaxLeft = 2  MaxCmds = 0
          FixCmdOrder = TRUE  FixStatusAge = TRUE  FirstFresh = FALSE
INVARIANT TypeOK SensorTruth
