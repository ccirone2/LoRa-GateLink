[pytest]
# Bench end-to-end tests: need both boards, the GateSim Uno and Home Assistant (see README "End-to-end tests").
addopts = -m "not soak" -ra
markers =
    soak: long repeated-cycle runs (select with -m soak)
    needs_key: needs GATELINK_KEY (the link key both boards share); skipped otherwise
