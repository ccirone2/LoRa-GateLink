<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bench Wiring</title>
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --ink: #1d1f21; --muted: #6b6f76; --line: #d9dbde; --accent: #2f6fd6;
    --connected: #2e8540; --unverified: #c77700; --planned: #2f6fd6; --open: #9aa0a6;
    --hl: #fff4c2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181b; --panel: #1f2226; --ink: #e6e7e9; --muted: #9aa0a6; --line: #34383d; --accent: #6ea0ff;
      --connected: #5cc46f; --unverified: #f0a33a; --planned: #6ea0ff; --open: #7b8188; --hl: #3a3420;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { position: sticky; top: 0; z-index: 2; background: var(--panel); border-bottom: 1px solid var(--line);
    padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
  h1 { font-size: 17px; margin: 0 8px 0 0; }
  .muted { color: var(--muted); }
  button, select, input { font: inherit; color: inherit; }
  button { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .5; cursor: default; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 999px;
    padding: 2px 10px; cursor: pointer; user-select: none; }
  .chip.off { opacity: .4; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
  main { padding: 16px; max-width: 1400px; margin: 0 auto; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-bottom: 16px; }
  #diagram { width: 100%; overflow-x: auto; }
  svg text { fill: var(--ink); font-size: 12px; }
  .devbox rect { fill: var(--panel); stroke: var(--line); }
  .devbox.sel rect { stroke: var(--accent); stroke-width: 2; }
  .devbox { cursor: pointer; }
  .wire { fill: none; stroke-width: 2.5; opacity: .85; cursor: pointer; }
  .wire.dim { opacity: .12; }
  .wire.hot { stroke-width: 5; opacity: 1; }
  h2 { font-size: 15px; margin: 4px 0 8px; }
  table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  col.c-end { width: 22%; } col.c-sig { width: 15%; } col.c-st { width: 12%; } col.c-note { width: 27%; } col.c-x { width: 2%; }
  th, td { text-align: left; padding: 5px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-weight: 600; color: var(--muted); font-size: 12px; }
  tr.hot td { background: var(--hl); }
  td.end b { font-weight: 600; }
  td input.txt { width: 100%; border: 1px solid transparent; background: transparent; padding: 2px 4px; border-radius: 4px; }
  td input.txt:hover, td input.txt:focus { border-color: var(--line); background: var(--bg); outline: none; }
  select.status { border-radius: 6px; border: 1px solid var(--line); background: var(--panel); padding: 2px 4px; }
  .del { border: none; background: none; color: var(--muted); padding: 0 4px; }
  .del:hover { color: #c0392b; }
  .add { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 6px; align-items: end; }
  .add label { display: flex; flex-direction: column; font-size: 12px; color: var(--muted); }
  .add input, .add select { border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; background: var(--bg); }
  #msg { font-size: 13px; }
  #msg.warn { color: var(--unverified); }
  .devnote { font-size: 12px; color: var(--muted); }
  @media (max-width: 700px) { th:nth-child(5), td:nth-child(5) { display: none; } }
</style>
</head>
<body>
<header>
  <h1 id="title">Bench wiring</h1>
  <button id="open" class="primary" title="Pick tools/bench-wiring/wiring.json so edits save straight to it">Open wiring.json…</button>
  <button id="reload" title="Re-read the file (e.g. after Claude edited it)">Reload</button>
  <button id="save" disabled title="Ctrl+S">Save</button>
  <button id="download" title="Download a copy (browsers without file access)">Download</button>
  <span class="chips" id="filters"></span>
  <input id="search" placeholder="Search…" style="border:1px solid var(--line);border-radius:6px;padding:4px 8px;background:var(--bg);min-width:140px">
  <span id="msg" class="muted"></span>
</header>
<main>
  <div class="panel"><div id="diagram"></div>
    <div class="muted" style="font-size:12px;margin-top:6px">One line per pair of devices (the number is how many wires), coloured by its least-settled wire. Hover a line to highlight its wires below; click a device to show only its wires (click again to clear).</div>
  </div>
  <div id="tables"></div>
  <div class="panel">
    <h2>Add a wire</h2>
    <div class="add">
      <label>From device<select id="aDev"></select></label>
      <label>Terminal<input id="aTerm" placeholder="e.g. IN4 (A4)"></label>
      <label>To device<select id="bDev"></select></label>
      <label>Terminal<input id="bTerm" placeholder="e.g. OUT4"></label>
      <label>Signal<input id="sig" placeholder="what it carries"></label>
      <label>Status<select id="st"></select></label>
      <button id="addBtn">Add</button>
    </div>
  </div>
</main>
<script>
const ORDER = ['open', 'connected', 'unverified', 'planned'];  // least settled last
const COLS = { house: 0, rig: 1, pc: 1, sim: 2, gate: 3 };
let data = null, handle = null, dirty = false, focusDev = null, hotPair = null;
const shown = new Set(['connected', 'unverified', 'planned', 'open']);
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const color = (st) => `var(--${st})`;
const dev = (id) => data.devices.find((d) => d.id === id) || { id, name: id, site: 'pc' };
const pairKey = (l) => [l.a[0], l.b[0]].sort().join('|');

function msg(text, warn) { $('msg').textContent = text; $('msg').className = warn ? 'warn' : 'muted'; }
function setDirty(d) {
  dirty = d;
  $('save').disabled = !d;
  $('save').classList.toggle('primary', d);
  if (d) msg(handle ? 'Unsaved changes' : 'Unsaved changes: open wiring.json to save, or Download', true);
}

async function loadFromHandle() {
  data = JSON.parse(await (await handle.getFile()).text());
  setDirty(false); render(); msg(`Loaded ${handle.name}`);
}
async function loadFetch() {
  try {
    const r = await fetch('wiring.json', { cache: 'no-store' });
    data = await r.json(); setDirty(false); render();
    msg('Loaded wiring.json (read-only until you open it with the button)');
  } catch (e) {
    msg('Open wiring.json with the button (or serve this folder: python -m http.server)', true);
  }
}
$('open').onclick = async () => {
  if (!window.showOpenFilePicker) return msg('This browser has no file access: use Chrome or Edge, or Download to save', true);
  if (dirty && !confirm('Discard unsaved changes?')) return;
  [handle] = await window.showOpenFilePicker({ types: [{ description: 'Wiring', accept: { 'application/json': ['.json'] } }] });
  await loadFromHandle();
};
$('reload').onclick = async () => {
  if (dirty && !confirm('Discard unsaved changes?')) return;
  handle ? loadFromHandle() : loadFetch();
};
async function save() {
  if (!dirty) return;
  if (!handle) return msg('Open wiring.json first (or Download)', true);
  data.updated = new Date().toISOString().slice(0, 10);
  const w = await handle.createWritable();
  await w.write(JSON.stringify(data, null, 2) + '\n'); await w.close();
  setDirty(false); msg(`Saved ${handle.name} ${new Date().toLocaleTimeString()}`);
}
$('save').onclick = save;
document.addEventListener('keydown', (e) => { if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); save(); } });
window.addEventListener('beforeunload', (e) => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });
$('download').onclick = () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2) + '\n'], { type: 'application/json' }));
  a.download = 'wiring.json'; a.click();
};
$('search').oninput = () => renderTables();

function visible(l) {
  if (!shown.has(l.status)) return false;
  if (focusDev && l.a[0] !== focusDev && l.b[0] !== focusDev) return false;
  const q = $('search').value.trim().toLowerCase();
  if (!q) return true;
  return [dev(l.a[0]).name, l.a[1], dev(l.b[0]).name, l.b[1], l.signal, l.note, l.status].join(' ').toLowerCase().includes(q);
}

function render() {
  $('title').textContent = `${data.title} · updated ${data.updated}`;
  document.title = 'Bench Wiring';
  $('filters').innerHTML = ORDER.map((s) => {
    const n = data.links.filter((l) => l.status === s).length;
    return `<span class="chip ${shown.has(s) ? '' : 'off'}" data-s="${s}" title="${esc(data.statuses[s])}">
      <span class="dot" style="background:${color(s)}"></span>${s} ${n}</span>`;
  }).join('');
  document.querySelectorAll('.chip').forEach((c) => c.onclick = () => {
    shown.has(c.dataset.s) ? shown.delete(c.dataset.s) : shown.add(c.dataset.s); render();
  });
  const opts = data.devices.map((d) => `<option value="${d.id}">${esc(d.name)}</option>`).join('');
  $('aDev').innerHTML = opts; $('bDev').innerHTML = opts;
  $('st').innerHTML = ORDER.map((s) => `<option${s === 'planned' ? ' selected' : ''}>${s}</option>`).join('');
  renderDiagram(); renderTables();
}

function renderDiagram() {
  const cols = [[], [], [], []];
  for (const d of data.devices) cols[COLS[d.site] ?? 1].push(d);
  const W = 230, BH = 30, GX = 120, GY = 14, PAD = 10;
  const pos = {};
  const height = Math.max(...cols.map((c) => c.length)) * (BH + GY) + PAD * 2 + 20;
  cols.forEach((c, ci) => c.forEach((d, ri) => { pos[d.id] = { x: PAD + ci * (W + GX), y: PAD + 20 + ri * (BH + GY) }; }));
  const width = PAD * 2 + 4 * W + 3 * GX;
  const pairs = new Map();
  for (const l of data.links) {
    if (!shown.has(l.status) || l.a[0] === l.b[0]) continue;
    const k = pairKey(l);
    const p = pairs.get(k) || { a: l.a[0], b: l.b[0], links: [] };
    p.links.push(l); pairs.set(k, p);
  }
  let wires = '';
  for (const [k, p] of pairs) {
    const A = pos[p.a], B = pos[p.b];
    if (!A || !B) continue;
    const st = p.links.map((l) => l.status).sort((x, y) => ORDER.indexOf(y) - ORDER.indexOf(x))[0];
    let x1, x2, path;
    const y1 = A.y + BH / 2, y2 = B.y + BH / 2;
    if (Math.abs(A.x - B.x) < 1) {  // same column: loop out sideways (left in the last column, so it stays visible)
      const left = A.x > width / 2;
      x1 = left ? A.x : A.x + W;
      const bulge = (left ? -1 : 1) * (30 + Math.abs(y2 - y1) * 0.25);
      path = `M${x1},${y1} C${x1 + bulge},${y1} ${x1 + bulge},${y2} ${x1},${y2}`;
    } else {
      const [L, R, yl, yr] = A.x < B.x ? [A, B, y1, y2] : [B, A, y2, y1];
      x1 = L.x + W; x2 = R.x;
      const mx = (x1 + x2) / 2;
      path = `M${x1},${yl} C${mx},${yl} ${mx},${yr} ${x2},${yr}`;
    }
    const dash = st === 'planned' ? 'stroke-dasharray="7 5"' : st === 'open' ? 'stroke-dasharray="2 4"' : '';
    const dim = focusDev && p.a !== focusDev && p.b !== focusDev ? 'dim' : '';
    wires += `<path class="wire ${dim} ${hotPair === k ? 'hot' : ''}" data-k="${k}" d="${path}" stroke="${color(st)}" ${dash}>
      <title>${esc(dev(p.a).name)} ↔ ${esc(dev(p.b).name)}: ${p.links.length} wire(s), ${st}</title></path>`;
  }
  let boxes = '';
  for (const d of data.devices) {
    const P = pos[d.id];
    const n = data.links.filter((l) => l.a[0] === d.id || l.b[0] === d.id).length;
    const name = d.name.length > 34 ? d.name.slice(0, 33) + '…' : d.name;
    boxes += `<g class="devbox ${focusDev === d.id ? 'sel' : ''}" data-d="${d.id}"><rect x="${P.x}" y="${P.y}" width="${W}" height="${BH}" rx="6"></rect>
      <text x="${P.x + 8}" y="${P.y + 19}">${esc(name)} <tspan fill="var(--muted)">(${n})</tspan></text><title>${esc(d.name)}\n${esc(d.note || '')}</title></g>`;
  }
  const heads = ['House side', 'Power rig · PC', 'GateSim', 'Gate side'].map((h, i) =>
    `<text x="${PAD + i * (W + GX)}" y="${PAD + 10}" fill="var(--muted)" font-weight="600">${h}</text>`).join('');
  $('diagram').innerHTML = `<svg viewBox="0 0 ${width} ${height}" width="${width}" height="${height}" role="img" aria-label="Wiring overview">${heads}${wires}${boxes}</svg>`;
  document.querySelectorAll('.wire').forEach((w) => {
    w.onmouseenter = () => { hotPair = w.dataset.k; w.classList.add('hot'); markRows(); };
    w.onmouseleave = () => { hotPair = null; w.classList.remove('hot'); markRows(); };
  });
  document.querySelectorAll('.devbox').forEach((g) => g.onclick = () => {
    focusDev = focusDev === g.dataset.d ? null : g.dataset.d; renderDiagram(); renderTables();
  });
}

function markRows() {
  document.querySelectorAll('tr[data-k]').forEach((r) => r.classList.toggle('hot', r.dataset.k === hotPair));
  if (hotPair) document.querySelector(`tr[data-k="${hotPair}"]`)?.scrollIntoView({ block: 'nearest' });
}

function renderTables() {
  let html = '';
  for (const s of data.sites) {
    const rows = data.links.filter((l) => dev(l.a[0]).site === s.id && visible(l));
    if (!rows.length) continue;
    html += `<div class="panel"><h2>${esc(s.name)}</h2><table><colgroup><col class="c-end"><col class="c-end"><col class="c-sig"><col class="c-st"><col class="c-note"><col class="c-x"></colgroup><thead><tr><th>From</th><th>To</th><th>Signal</th><th>Status</th><th>Note</th><th></th></tr></thead><tbody>`;
    for (const l of rows) {
      const i = data.links.indexOf(l);
      html += `<tr data-k="${pairKey(l)}">
        <td class="end"><b>${esc(dev(l.a[0]).name)}</b><br><input class="txt" data-i="${i}" data-f="a1" value="${esc(l.a[1])}"></td>
        <td class="end"><b>${esc(dev(l.b[0]).name)}</b><br><input class="txt" data-i="${i}" data-f="b1" value="${esc(l.b[1])}"></td>
        <td><input class="txt" data-i="${i}" data-f="signal" value="${esc(l.signal)}" title="${esc(l.signal)}"></td>
        <td><span class="dot" style="background:${color(l.status)}"></span>
          <select class="status" data-i="${i}">${ORDER.map((o) => `<option${o === l.status ? ' selected' : ''}>${o}</option>`).join('')}</select></td>
        <td><input class="txt" data-i="${i}" data-f="note" value="${esc(l.note)}" title="${esc(l.note)}" placeholder="note"></td>
        <td><button class="del" data-i="${i}" title="Delete this wire">✕</button></td></tr>`;
    }
    html += '</tbody></table></div>';
  }
  $('tables').innerHTML = html || '<div class="panel muted">No wires match.</div>';
  document.querySelectorAll('select.status').forEach((s) => s.onchange = () => {
    data.links[s.dataset.i].status = s.value; setDirty(true); render();
  });
  document.querySelectorAll('input.txt').forEach((t) => t.onchange = () => {
    const l = data.links[t.dataset.i], f = t.dataset.f;
    if (f === 'a1') l.a[1] = t.value; else if (f === 'b1') l.b[1] = t.value; else l[f] = t.value;
    setDirty(true);
  });
  document.querySelectorAll('.del').forEach((b) => b.onclick = () => {
    const l = data.links[b.dataset.i];
    if (!confirm(`Delete ${dev(l.a[0]).name} ${l.a[1]} → ${dev(l.b[0]).name} ${l.b[1]}?`)) return;
    data.links.splice(b.dataset.i, 1); setDirty(true); render();
  });
  markRows();
}

$('addBtn').onclick = () => {
  const a = [$('aDev').value, $('aTerm').value.trim()], b = [$('bDev').value, $('bTerm').value.trim()];
  if (!a[1] || !b[1]) return msg('Give both terminals', true);
  data.links.push({ id: `w${Date.now().toString(36)}`, a, b, signal: $('sig').value.trim(), status: $('st').value, note: '' });
  ['aTerm', 'bTerm', 'sig'].forEach((id) => { $(id).value = ''; });
  setDirty(true); render();
};

loadFetch();
</script>
</body>
</html>
