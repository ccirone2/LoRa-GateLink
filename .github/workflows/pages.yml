name: Deploy web console to Pages

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/pages.yml']
  workflow_dispatch:
  # Redeploy once a release has its .bin, so the page offers it.
  workflow_run:
    workflows: [Release firmware binary]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Syntax check web console
        run: for f in web/app.js web/js/*.js; do node --check "$f"; done
      # The web console's "Install latest" flashes this copy: the page can't fetch release assets from
      # github.com itself (no CORS). Deployed only, never committed.
      - name: Bundle the latest release firmware
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName) || { echo "No release yet"; exit 0; }
          mkdir -p web/firmware
          if ! gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "GateLink-$tag.bin" --dir web/firmware; then
            echo "::warning::$tag has no GateLink-$tag.bin yet; the page offers file upload only"
            exit 0
          fi
          f="GateLink-$tag.bin"
          # Check it against the checksum published with the release (attached since v0.13.0), so a damaged or
          # swapped download isn't deployed with a checksum of its own.
          if gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$f.sha256" --dir "$RUNNER_TEMP"; then
            (cd web/firmware && sha256sum -c "$RUNNER_TEMP/$f.sha256")
          else
            echo "::warning::$tag has no $f.sha256 (released before v0.13.0); deploying it unchecked"
          fi
          printf '{"version":"%s","file":"%s","sha256":"%s","size":%d}\n' \
            "${tag#v}" "$f" "$(sha256sum "web/firmware/$f" | cut -d' ' -f1)" "$(stat -c %s "web/firmware/$f")" \
            > web/firmware/latest.json
          cat web/firmware/latest.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
