\* model: GateLink
\* The house since 0.20.4 (FixStatusAge): a STATUS older than STALE by its reckoning of the gate's clock isn't taken.
\* With STATUS withheld, replayed and delayed by the attacker, and both boards rebooting, the contact sensor shows
\* closed at most LAG = L + 2 STALE - 1 after the gate leaves closed: one STALE for the reading the reckoning rests on,
\* one for the report, the link timeout L less the tick it's last up. FirstFresh: the first reading of a gate session
\* is at most STALE old (status_first.cfg shows why that is an assumption); status_tight.cfg that the bound is exact.
\* Size: 148 M distinct states, depth 27; 22 minutes on 3 workers with java -Xmx4g, TLC -fpmem 0.6 and 8 GB free for
\* its queue (-metadir). With the defaults (a quarter of the heap for fingerprints) it spilled past 8 GB.
SPECIFICATION Spec
VIEW SensorView
CONSTANTS L = 3  TTL = 3  SLACK = 1  AHEAD = 4  STALE = 1  LAG = 4  MISSED = 1
          MaxTime = 8  MaxSeq = 4  MaxGateSeq = 4  MaxBoots = 2  MaxLeft = 2  MaxCmds = 0
          FixCmdOrder = TRUE  FixStatusAge = TRUE  FirstFresh = TRUE
INVARIANT TypeOK SensorTruth
