name: Release firmware binary

# Checks the release evidence (docs/release-criteria.md), builds the firmware at a release's tag and attaches
# GateLink-<tag>.bin, its .sha256 and the evidence file to the release.
# Run by hand (workflow_dispatch) to add the binary to an existing release. A binary already attached is never
# replaced unless `replace` is ticked: the web console and anyone who downloaded it rely on it staying the same.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build, e.g. v0.3.5
        required: true
      replace:
        description: Replace a binary already attached to the release
        type: boolean
        default: false

permissions:
  contents: write
  actions: read  # the evidence check reads the CI runs of the tagged commit

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0  # all tags: the evidence check works out the release kind from the previous release
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      # Before building: no binary for a release without complete evidence. Tags from before the release criteria
      # (no tools/release_evidence.py) are built without it.
      - name: Check the release evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f tools/release_evidence.py ]; then
            echo "::notice::$TAG predates the release criteria: no evidence to check"
            exit 0
          fi
          if ! python tools/release_evidence.py check "$TAG" --ci; then
            msg="$TAG has no complete release evidence (docs/releases/$TAG.md; what's missing is listed above,"
            msg+=" the criteria are in docs/release-criteria.md). Collect it with tools/release_evidence.py, merge it,"
            msg+=" wait for CI to pass on the merge commit, then re-run this workflow."
            echo "::error::$msg"
            exit 1
          fi
      - uses: arduino/setup-arduino-cli@81d310742121c928ea9c8bbd407b4217b432ae02 # v2.0.0
      # Versions: keep in sync with docs/development.md and ci.yml.
      - name: Install core and libraries
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:samd@1.8.14
          arduino-cli lib install "LoRa@0.8.0" "Crypto@0.4.0" "FlashStorage@1.0.0" "ArduinoJson@7.4.3" \
            "Adafruit SleepyDog Library@1.8.4"
      - name: Compile
        run: arduino-cli compile --fqbn arduino:samd:mkrwan1310 --output-dir build firmware/GateLink
      - name: Check FW_VERSION matches the tag
        run: |
          v=$(sed -n 's/^#define FW_VERSION "\(.*\)"/\1/p' firmware/GateLink/config.h)
          [ "v$v" = "$TAG" ] || { echo "FW_VERSION $v doesn't match tag $TAG"; exit 1; }
      - name: Attach binary, checksum and evidence to the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPLACE: ${{ inputs.replace || false }}
        run: |
          f="GateLink-$TAG.bin"
          cp build/GateLink.ino.bin "$f"
          sha256sum "$f" > "$f.sha256"
          cat "$f.sha256"
          files=("$f" "$f.sha256")
          if [ -f "docs/releases/$TAG.md" ]; then
            cp "docs/releases/$TAG.md" "GateLink-$TAG-evidence.md"
            files+=("GateLink-$TAG-evidence.md")
          fi
          have=$(gh release view "$TAG" --json assets -q '.assets[].name')
          if grep -qx "$f" <<< "$have" && [ "$REPLACE" != "true" ]; then
            echo "::error::$TAG already has $f; run this workflow with 'replace' ticked to rebuild and replace it"
            exit 1
          fi
          gh release upload "$TAG" "${files[@]}" --clobber
