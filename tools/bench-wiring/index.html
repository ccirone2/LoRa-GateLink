<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bench Wiring</title>
<style>
  :root {
    --bg: #f6f6f3; --panel: #ffffff; --ink: #1d1f21; --muted: #6b6f76; --line: #d4d6da; --accent: #2f6fd6;
    --box: #ffffff; --boxline: #3a3d42; --bus: #3a3d42;
    --connected: #1d1f21; --unverified: #c77700; --planned: #2f6fd6; --open: #a0a5ab; --sel: #e0398a;
    --bench: #0f9b8e;  /* border of bench-rig-only devices; teal is no wire colour */
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15171a; --panel: #1f2226; --ink: #e6e7e9; --muted: #9aa0a6; --line: #34383d; --accent: #6ea0ff;
      --box: #1f2226; --boxline: #b9bec5; --bus: #b9bec5;
      --connected: #e6e7e9; --unverified: #f0a33a; --planned: #6ea0ff; --open: #6b7178; --sel: #ff6eb4;
      --bench: #3cc9b9;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { position: sticky; top: 0; z-index: 3; background: var(--panel); border-bottom: 1px solid var(--line);
    padding: 8px 16px; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
  h1 { font-size: 16px; margin: 0 6px 0 0; }
  button, select, input, textarea { font: inherit; color: inherit; }
  button { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .5; cursor: default; }
  .chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 999px;
    padding: 1px 10px; cursor: pointer; user-select: none; font-size: 13px; }
  .chip.off { opacity: .35; }
  .sw { width: 18px; height: 0; border-top: 3px solid; display: inline-block; }
  #msg { font-size: 13px; color: var(--muted); }
  #msg.warn { color: var(--unverified); }
  #plain { display: none; margin: 12px 12px 0; padding: 10px 14px; border: 2px solid var(--unverified); border-radius: 8px;
    background: var(--panel); font-size: 14px; }
  #plain.on { display: block; }
  #plain code { background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; }
  #wrap { overflow: auto; padding: 12px; }
  svg { display: block; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
  svg text { fill: var(--ink); font-size: 11px; font-family: system-ui, sans-serif; }
  .box { fill: var(--box); stroke: var(--boxline); stroke-width: 1.4; }
  .usbcore { fill: none; stroke: #d62828; stroke-width: .9; }
  .usbtag { fill: var(--panel); stroke: #8d939a; }
  .box.bench { stroke: var(--bench); stroke-width: 2.4; }
  .benchkey { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; }
  .benchkey i { width: 18px; height: 12px; border: 2.4px solid var(--bench); border-radius: 3px; }
  .dname { font-weight: 600; font-size: 12px; }
  .term { fill: var(--panel); stroke: var(--boxline); stroke-width: 1.2; }
  .tlabel { fill: var(--muted); font-size: 10px; }
  .busline { stroke: var(--bus); stroke-width: 3.4; }
  .bushalo { stroke: var(--muted); stroke-width: 5.6; opacity: .55; }
  .buslabel { font-size: 11px; font-weight: 600; fill: var(--muted); }
  .wire { fill: none; stroke-width: 2.2; stroke-linejoin: round; }
  .halo { fill: none; stroke: var(--muted); stroke-width: 4; stroke-linejoin: round; opacity: .55; }
  .hit { fill: none; stroke: transparent; stroke-width: 10; cursor: pointer; }
  .selglow { fill: none; stroke: var(--sel); stroke-width: 10; stroke-linejoin: round; stroke-linecap: round; opacity: .35; }
  .dot { stroke: none; }
  .cut path { fill: var(--panel); stroke: var(--ink); stroke-width: 1.3; }
  .cut text { font-size: 9.5px; font-weight: 700; }
  .cut .pol { fill: var(--ink); stroke: none; }
  .dsub { font-size: 10.5px; fill: var(--muted); }
  .band { fill: none; stroke: var(--boxline); stroke-width: 1; opacity: .45; }
  .bandname { font-size: 15px; font-weight: 700; fill: var(--ink); }
  .via { font-size: 10px; font-weight: 600; }
  #panel { position: fixed; right: 16px; bottom: 16px; width: 340px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 12px; box-shadow: 0 6px 24px rgba(0,0,0,.18); display: none; z-index: 4; }
  #panel h3 { margin: 0 0 4px; font-size: 14px; }
  #panel .ends { font-size: 13px; margin-bottom: 8px; }
  #panel label { display: block; font-size: 12px; color: var(--muted); margin-top: 6px; }
  #panel select, #panel textarea, #panel input { width: 100%; border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; background: var(--bg); }
  #panel textarea { height: 64px; resize: vertical; }
  #tip { position: fixed; pointer-events: none; background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
    padding: 4px 8px; font-size: 12px; display: none; z-index: 5; max-width: 320px; }
  #todo { padding: 0 12px 24px; }
  #todo h2 { font-size: 14px; margin: 8px 0; }
  #todo li { cursor: pointer; margin: 2px 0; }
  #todo li:hover { text-decoration: underline; }
</style>
</head>
<body>
<header>
  <h1 id="title">Bench wiring</h1>
  <button id="open" class="primary" title="Pick tools/bench-wiring/wiring.json so edits save straight to it">Open wiring.json…</button>
  <button id="reload" title="Re-read the file (e.g. after Claude edited it)">Reload</button>
  <button id="save" disabled title="Ctrl+S">Save</button>
  <button id="fit" title="Fit the diagram to the window, or show it at full size">Actual size</button>
  <span id="chips"></span>
  <span class="benchkey" title="Devices with this border are only part of the bench test rig, not the install"><i></i>bench rig only</span>
  <span class="benchkey" title="USB cable that carries 5 V (red core) or is power-blocked (data only)">
    <svg width="26" height="8"><line x1="1" y1="4" x2="25" y2="4" stroke="#8d939a" stroke-width="2.2"></line><line x1="1" y1="4" x2="25" y2="4" stroke="#d62828" stroke-width=".9"></line></svg>USB powered
    <svg width="26" height="8"><line x1="1" y1="4" x2="25" y2="4" stroke="#8d939a" stroke-width="2.2"></line></svg>USB data only</span>
  <span id="msg"></span>
</header>
<div id="plain"><b>Save can't write wiring.json in place:</b> this page isn't served by <code>serve.py</code>, so Save asks
  for the file. Stop this server and run <code>python tools/bench-wiring/serve.py</code> from the repo root, then reload
  this page (<a href="http://localhost:8001/">localhost:8001</a>).</div>
<div id="wrap"><div id="diagram"></div></div>
<div id="todo"></div>
<div id="panel">
  <h3 id="pSig"></h3>
  <div class="ends" id="pEnds"></div>
  <label>Status <select id="pStatus"></select></label>
  <label>Wire colour <select id="pColor"></select></label>
  <label>Note <textarea id="pNote"></textarea></label>
  <div style="display:flex;justify-content:space-between;margin-top:8px">
    <span id="pDesc" style="font-size:12px;color:var(--muted)"></span>
    <button id="pClose">Close</button>
  </div>
</div>
<div id="tip"></div>
<script>
// ---- layout constants --------------------------------------------------------------------------------------------
const L = { sidePitch: 20, tbPitch: 66, labelZone: 16, nameLine: 15, gap: 70, bandGap: 170, busPitch: 16,
  busTop: 46, lanePitch: 9, stub: 14, charW: 6.1, minW: 150, gutter: 250 };
const STATUS = ['connected', 'unverified', 'planned', 'open'];
const DASH = { connected: '', unverified: '7 4', planned: '2 4', open: '1 6' };
// Physical insulation colours. A wire without one takes its bus's colour (USB grey, other signals light grey).
const WIRE = { red: '#d62828', black: '#111111', white: '#f4f4f4', yellow: '#e9c46a', orange: '#f4a261', green: '#2a9d4f',
  blue: '#2f6fd6', brown: '#8b5a2b', purple: '#8e5bd6', grey: '#8d939a', pink: '#e86fb0' };
const UNSET = '#a3a8ae';
function busColor(id) { const b = data.buses.find((x) => x.id === id); return WIRE[b?.color] || WIRE.grey; }
function wireColor(w) {
  if (w.color && WIRE[w.color]) return WIRE[w.color];
  if (w.to === 'pc') return WIRE.grey;
  if (w.bus) return busColor(w.bus);
  return UNSET;
}
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let data, handle = null, serverSave = false, dirty = false, selected = null, fit = true;
const shown = new Set(STATUS);
// The dialog fallback reopens in the folder picked last time.
const PICK = { id: 'bench-wiring', types: [{ description: 'Wiring', accept: { 'application/json': ['.json'] } }] };

// ---- file handling: serve.py saves back to the served wiring.json; otherwise Chrome/Edge File System Access -------------
function msg(t, warn) { $('msg').textContent = t; $('msg').className = warn ? 'warn' : ''; }
function setDirty(d) {
  dirty = d; $('save').disabled = !d; $('save').classList.toggle('primary', d);
  if (d) msg(handle || serverSave ? 'Unsaved changes' : 'Unsaved changes: Save asks where wiring.json is', true);
}
async function loadHandle() {
  data = JSON.parse(await (await handle.getFile()).text()); setDirty(false); draw(); msg(`Loaded ${handle.name}`);
  $('plain').classList.remove('on');
}
async function loadFetch() {
  try {
    const r = await fetch('wiring.json', { cache: 'no-store' });
    serverSave = r.headers.get('X-Bench-Wiring-Save') === '1';
    $('plain').classList.toggle('on', !serverSave);
    $('open').classList.toggle('primary', !serverSave);
    data = await r.json(); setDirty(false); draw();
    msg(serverSave ? 'Save writes the served wiring.json' : 'Plain server: Save asks for the file (serve.py saves in place)');
  } catch (e) { $('plain').classList.add('on'); msg('Could not load wiring.json: use Open wiring.json…', true); }
}
$('open').onclick = async () => {
  if (!window.showOpenFilePicker) return msg('Needs Chrome or Edge to save', true);
  if (dirty && !confirm('Discard unsaved changes?')) return;
  try { [handle] = await window.showOpenFilePicker(PICK); } catch (e) { return; }
  await loadHandle();
};
$('reload').onclick = () => { if (dirty && !confirm('Discard unsaved changes?')) return; handle ? loadHandle() : loadFetch(); };
async function save() {
  if (!dirty) return;
  try {
    data.updated = new Date().toISOString().slice(0, 10);
    const text = JSON.stringify(data, null, 2) + '\n';
    if (!handle && serverSave) {
      const r = await fetch('wiring.json', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: text });
      if (!r.ok) throw new Error(`${r.status} ${r.statusText}`);
      setDirty(false); msg(`Saved ${new Date().toLocaleTimeString()}`); draw();
      return;
    }
    // Plain server: ask where wiring.json is (once), then keep that handle.
    if (!handle) {
      if (!window.showSaveFilePicker) return msg('Needs Chrome or Edge to save', true);
      handle = await window.showSaveFilePicker({ ...PICK, suggestedName: 'wiring.json' });
      $('plain').classList.remove('on');
    }
    const w = await handle.createWritable(); await w.write(text); await w.close();
    setDirty(false); msg(`Saved to ${handle.name} ${new Date().toLocaleTimeString()}`); draw();
  } catch (e) {
    if (e.name !== 'AbortError') msg(`Save failed: ${e.message}`, true);
  }
}
$('save').onclick = save;
document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); save(); }
  if (e.key === 'Escape') select(null);
});
window.addEventListener('beforeunload', (e) => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });
$('fit').onclick = () => { fit = !fit; $('fit').textContent = fit ? 'Actual size' : 'Fit width'; draw(); };

// ---- layout -----------------------------------------------------------------------------------------------------
const tw = (s) => String(s).length * L.charW;
function nameLines(name, w) {
  const max = Math.floor((w - 16) / (L.charW * 1.1));
  if (name.length <= max) return [name];
  const i = name.lastIndexOf(' ', max);
  return [name.slice(0, i > 0 ? i : max), name.slice(i > 0 ? i + 1 : max)];
}
function measure(d, width) {
  const top = d.top || [], bottom = d.bottom || [], left = d.left || [], right = d.right || [];
  const side = Math.max(...left.map(tw), 0) + Math.max(...right.map(tw), 0) + 40;
  const w = width || Math.max(L.minW, Math.min(tw(d.name) * 1.1 + 24, 260), side, (top.length + 0.4) * L.tbPitch, (bottom.length + 0.4) * L.tbPitch);
  const lines = nameLines(d.name, w).length + (d.sub ? 1 : 0);
  const h = L.labelZone + 8 + lines * L.nameLine + 6 + Math.max(left.length, right.length) * L.sidePitch + (bottom.length ? L.labelZone + 4 : 6);
  return { w, h, lines };
}

function termPos(box, name) {
  const d = box.d;
  for (const side of ['top', 'bottom', 'left', 'right']) {
    const list = d[side] || [];
    const i = name ? list.indexOf(name) : -1;  // "" is a spacer, never a terminal
    if (i < 0) continue;
    if (side === 'top' || side === 'bottom') {
      const x = box.x + (i + 0.7) * (box.w / (list.length + 0.4));
      return { x, y: side === 'top' ? box.y : box.y + box.h, side, box };
    }
    const y = box.y + L.labelZone + 8 + box.lines * L.nameLine + 6 + (i + 0.5) * L.sidePitch;
    return { x: side === 'left' ? box.x : box.x + box.w, y, side, box };
  }
  return null;
}

const parse = (ref) => { const [dev, ...t] = ref.split(':'); return { dev, term: t.join(':') }; };
const out = (P, n) => ({ x: P.x + (P.side === 'left' ? -n : P.side === 'right' ? n : 0),
  y: P.y + (P.side === 'top' ? -n : P.side === 'bottom' ? n : 0) });

// One site: its buses on top, a row of devices, lanes for wires that go round boxes, the comms row, then a PC strip.
function layoutBand(band, y0, devs) {
  const boxes = {}, buses = {};
  const busList = data.buses.filter((b) => b.band === band.id);
  const busTop = y0 + 34;
  busList.forEach((b, i) => { buses[b.id] = { ...b, y: busTop + i * L.busPitch, xs: [] }; });
  const rowTop = busTop + busList.length * L.busPitch + 26;
  // Every box in the row gets the same header height, so side terminals line up across boxes.
  const ms = band.devices.map((id) => measure(devs[id]));
  const lines = Math.max(...ms.map((m) => m.lines));
  let x = L.gutter;
  band.devices.forEach((id, k) => {
    const m = ms[k], h = m.h + (lines - m.lines) * L.nameLine;
    boxes[id] = { id, x, y: rowTop, ...m, h, lines, d: devs[id] };
    x += m.w + L.gap;
  });
  const width = x - L.gap + 230;  // room for off-diagram labels on the right
  const rowBottom = rowTop + Math.max(...Object.values(boxes).map((b) => b.h));
  const comms = (data.comms || []).filter((c) => band.devices.includes(c.under));
  for (const c of comms) {
    const d = devs[c.device], over = boxes[c.under];
    let m = measure(d), cx = over.x + over.w / 2 - m.w / 2;
    // Give the comms box the same terminal pitch as the bottom of the box above and shift it so each of its top
    // terminals sits right under the one it's wired to: those wires drop straight down. Needs every pair at the same
    // index offset (e.g. TX/RX/GND under 13 RX/14 TX/GND); otherwise it stays centred.
    const top = d.top || [], bot = over.d.bottom || [], offs = new Set();
    for (const w of data.wires) {
      if (!w.to || w.to === 'pc') continue;
      const [e1, e2] = [parse(w.from), parse(w.to)];
      const [mine, other] = e1.dev === c.device ? [e1, e2] : [e2, e1];
      if (mine.dev !== c.device || other.dev !== c.under) continue;
      const i = top.indexOf(mine.term), j = bot.indexOf(other.term);
      if (i >= 0 && j >= 0) offs.add(j - i);
    }
    if (offs.size === 1) {
      const pitch = over.w / (bot.length + 0.4);
      m = measure(d, pitch * (top.length + 0.4));
      cx = over.x + [...offs][0] * pitch;
    }
    boxes[c.device] = { id: c.device, x: cx, y: 0, ...m, d, comms: true };
  }
  const wires = data.wires.map((w, i) => ({ w, i })).filter(({ w }) => boxes[parse(w.from).dev]);
  const blocked = (x1, x2) => Object.values(boxes).some((b) => !b.comms && b.x > Math.min(x1, x2) + 1 && b.x + b.w < Math.max(x1, x2) - 1);

  // Pass 1: classify, and give each wire that must go round boxes its own lane below the row.
  let lanes = 0;
  const plan = [];
  for (const { w, i } of wires) {
    const a = parse(w.from);
    if (!termPos(boxes[a.dev], a.term)) { console.warn('unknown terminal', w.from); continue; }
    const p = { w, i, a };
    if (w.bus) p.kind = buses[w.bus] ? 'bus' : null;
    else if (w.label) p.kind = 'label';
    else if (w.to === 'pc') p.kind = 'pc';
    else if (!w.to) p.kind = 'open';
    else {
      p.b = parse(w.to);
      const bb = boxes[p.b.dev];
      if (!bb || !termPos(bb, p.b.term)) { console.warn('unknown terminal', w.to); continue; }
      if (boxes[a.dev].comms || bb.comms) p.kind = 'vz';
      else {
        const A = termPos(boxes[a.dev], a.term), B = termPos(bb, p.b.term);
        const [P, Q] = A.x <= B.x ? [A, B] : [B, A];
        p.kind = P.side === 'right' && Q.side === 'left' && !blocked(P.x, Q.x) ? 'z' : 'lane';
      }
    }
    if (!p.kind) { console.warn('unknown bus', w.bus); continue; }
    plan.push(p);
  }
  // A lane runs just under the boxes it passes (not the whole row), or level with its left terminal when that is
  // lower still, so wires off a tall box (the Uno's D7-D10) run straight out. Lanes take tracks in the order of their
  // left end, top terminal first, a lane pitch apart where their spans overlap, so they don't cross at that end.
  const ends = (p) => {
    const A = termPos(boxes[p.a.dev], p.a.term), B = termPos(boxes[p.b.dev], p.b.term);
    return A.x <= B.x ? [A, B] : [B, A];
  };
  const placed = [];
  plan.filter((p) => p.kind === 'lane').map((p) => ({ p, e: ends(p) }))
    .sort((a, b) => a.e[0].x - b.e[0].x || a.e[0].y - b.e[0].y).forEach(({ p, e: [P, Q] }) => {
      const under = Object.values(boxes).filter((b) => !b.comms && b.x < Q.x - 1 && b.x + b.w > P.x + 1);
      let y = Math.max(...under.map((b) => b.y + b.h), rowTop) + 16;
      if (P.side === 'right' && P.y > y) y = P.y;
      const near = (o) => o.x1 < Q.x + 60 && P.x < o.x2 + 60 && Math.abs(o.y - y) < L.lanePitch;
      while (placed.some(near)) y += L.lanePitch;
      p.lane = ++lanes; p.laneY = y;
      placed.push({ x1: P.x, x2: Q.x, y });
    });
  const commsY = Math.max(rowBottom + 16, ...placed.map((o) => o.y)) + 30;
  for (const c of comms) boxes[c.device].y = commsY;
  const lowest = Math.max(commsY - 30, ...comms.map((c) => commsY + boxes[c.device].h));
  const pcY = lowest + 36;
  // A lane level with its terminal leaves straight out of it: no vertical run, so no slot.
  const straight = (P, p) => Math.abs(P.y - p.laneY) < 0.5 && (P.side === 'right' || P.side === 'left');

  // Pass 2: every wire that leaves a box side and then runs vertically gets its own slot (x) in the gap, counted
  // out from that side: bus drops first (top terminal innermost, so they don't cross each other), then Z jogs, then
  // lane stubs (bottom terminal innermost).
  const reqs = {};
  const want = (P, p, rank) => {
    if (P.side !== 'left' && P.side !== 'right') return;
    (reqs[P.box.id + P.side] ||= []).push({ P, p, rank });
  };
  for (const p of plan) {
    const A = termPos(boxes[p.a.dev], p.a.term), B = p.b && termPos(boxes[p.b.dev], p.b.term);
    if (p.kind === 'bus') want(A, p, A.y);
    else if (p.kind === 'z') {
      const P = A.x <= B.x ? A : B, Q = P === A ? B : A;
      if (Math.abs(P.y - Q.y) > 1) want(P, p, 1e5 + P.y);
    } else if (p.kind === 'lane') {
      if (!straight(A, p)) want(A, p, 2e5 - A.y);
      if (!straight(B, p)) want(B, p, 2e5 - B.y);
    }
  }
  const slot = new Map();  // `${wire}:${end x}` -> x of its vertical run
  for (const list of Object.values(reqs)) {
    list.sort((a, b) => a.rank - b.rank).forEach(({ P, p }, k) => {
      slot.set(`${p.i}:${P.x}`, P.x + (P.side === 'right' ? 1 : -1) * (10 + k * 6));
    });
  }
  const side = (P, p) => { const x = slot.get(`${p.i}:${P.x}`); return x === undefined ? null : { x, y: P.y }; };

  // Pass 3: route.
  let vz = 0;
  const routes = [];
  for (const p of plan) {
    const { w } = p;
    const A = termPos(boxes[p.a.dev], p.a.term);
    const B = p.b && termPos(boxes[p.b.dev], p.b.term);
    let path, label = null, junction = null, cross = null;
    if (p.kind === 'bus') {
      const bus = buses[w.bus];
      if (A.side === 'top') path = [A, { x: A.x, y: bus.y }];
      else { const s = side(A, p) || out(A, L.stub + 6); path = [A, s, { x: s.x, y: bus.y }]; }
      junction = path[path.length - 1]; bus.xs.push(junction.x);
    } else if (p.kind === 'label') {
      const s = out(A, 30), gap = w.cut ? 22 : 4;  // room for the cut diamond at the stub's end
      path = [A, s];
      label = A.side === 'top' ? { x: s.x, y: s.y - 6 - (gap - 4), anchor: 'middle' }
        : { x: s.x + (A.side === 'left' ? -gap : gap), y: s.y + 3.5, anchor: A.side === 'left' ? 'end' : 'start' };
      if (w.cut) label.cut = out(A, 30 + 9);
      label.text = w.label;
    } else if (p.kind === 'open') {
      cross = out(A, 10); path = [A, cross];
    } else if (p.kind === 'pc') {
      path = [A, { x: A.x, y: pcY }];
    } else if (p.kind === 'z') {
      const [P, Q] = A.x <= B.x ? [A, B] : [B, A];
      const s = side(P, p);
      path = s ? [P, s, { x: s.x, y: Q.y }, Q] : [P, Q];
    } else if (p.kind === 'vz') {
      const [P, Q] = A.y <= B.y ? [A, B] : [B, A];
      if (Math.abs(P.x - Q.x) < 1) path = [P, Q];
      else { const my = P.y + 12 + (vz++) * 6; path = [P, { x: P.x, y: my }, { x: Q.x, y: my }, Q]; }
    } else {
      const ly = p.laneY, n = L.stub + p.lane * 3;
      const leg = (P) => {
        if (straight(P, p)) return [P];
        const s = side(P, p) || out(P, n);
        return [P, s, { x: s.x, y: ly }];
      };
      path = [...leg(A), ...leg(B).reverse()];
    }
    routes.push({ ...p, path, label, junction, cross });
  }
  return { band, y0, boxes, buses, routes, pcY, width, bottom: pcY + 30 };
}

function draw() {
  $('title').textContent = `${data.title} · updated ${data.updated}`;
  const devs = Object.fromEntries(data.devices.map((d) => [d.id, d]));
  const bands = [];
  let y = 0;
  for (const band of data.bands) { const B = layoutBand(band, y, devs); bands.push(B); y = B.bottom + 40; }
  const width = Math.max(...bands.map((b) => b.width)), height = y;
  let s = '';
  for (const B of bands) {
    // Each site is a container: names inside it don't repeat the site.
    s += `<rect class="band" x="8" y="${B.y0 + 4}" width="${width - 16}" height="${B.bottom - B.y0 - 2}" rx="10"></rect>`;
    s += `<text class="bandname" x="20" y="${B.y0 + 24}">${esc(B.band.name)}</text>`;
    for (const b of Object.values(B.buses)) {
      if (!b.xs.length) continue;
      const x1 = Math.min(...b.xs) - 10, x2 = Math.max(...b.xs) + 10;
      s += `<line class="bushalo" x1="${x1}" y1="${b.y}" x2="${x2}" y2="${b.y}"></line>`;
      s += `<line class="busline" x1="${x1}" y1="${b.y}" x2="${x2}" y2="${b.y}" style="stroke:${WIRE[b.color] || 'var(--bus)'}"><title>${esc(b.name)}</title></line>`;
      s += `<line x1="${L.gutter - 6}" y1="${b.y}" x2="${x1}" y2="${b.y}" stroke="var(--line)" stroke-dasharray="2 3"></line>`;
      s += `<text class="buslabel" x="${L.gutter - 10}" y="${b.y + 4}" text-anchor="end">${esc(b.name)}</text>`;
    }
    const drops = B.routes.filter((r) => r.kind === 'pc').map((r) => r.path[0].x);
    if (drops.length) {
      s += `<rect class="box${devs.pc?.bench ? ' bench' : ''}" x="20" y="${B.pcY}" width="${width - 40}" height="26" rx="6"></rect>`;
      s += `<text class="dname" x="30" y="${B.pcY + 17}">${esc(devs.pc?.name || 'PC')}</text>`;
    }
    for (const b of Object.values(B.boxes)) {
      s += `<g><rect class="box${b.d.bench ? ' bench' : ''}" x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" rx="6"><title>${esc(b.d.name)}${b.d.note ? '\n' + esc(b.d.note) : ''}</title></rect>`;
      const names = nameLines(b.d.name, b.w);
      names.forEach((ln, i) => {
        s += `<text class="dname" x="${b.x + b.w / 2}" y="${b.y + L.labelZone + 8 + (i + 0.8) * L.nameLine}" text-anchor="middle">${esc(ln)}</text>`;
      });
      if (b.d.sub) s += `<text class="dsub" x="${b.x + b.w / 2}" y="${b.y + L.labelZone + 8 + (names.length + 0.8) * L.nameLine}" text-anchor="middle">${esc(b.d.sub)}</text>`;
      for (const side of ['top', 'bottom', 'left', 'right']) for (const t of b.d[side] || []) {
        if (!t) continue;
        const P = termPos(b, t);
        const lx = side === 'left' ? P.x + 6 : side === 'right' ? P.x - 6 : P.x;
        const ly = side === 'top' ? P.y + 12 : side === 'bottom' ? P.y - 5 : P.y + 3.5;
        s += `<text class="tlabel" x="${lx}" y="${ly}" text-anchor="${side === 'left' ? 'start' : side === 'right' ? 'end' : 'middle'}">${esc(t)}</text>`;
      }
      s += '</g>';
    }
    for (const r of B.routes) {
      if (!shown.has(r.w.status)) continue;
      const d = 'M' + r.path.map((q) => `${q.x.toFixed(1)},${q.y.toFixed(1)}`).join(' L');
      const col = wireColor(r.w);
      // Underlay first, so black and white wires show on either background.
      s += `<path class="halo" d="${d}" stroke-dasharray="${DASH[r.w.status]}"></path>`;
      // The selected wire keeps its own colour; a soft glow behind it marks the selection.
      if (selected === r.i) s += `<path class="selglow" d="${d}"></path>`;
      s += `<path class="wire" d="${d}" stroke="${col}" stroke-dasharray="${DASH[r.w.status]}"></path>`;
      // USB: a red core marks a cable that carries 5 V; a power-blocked one is tagged "data only".
      if (r.w.usb === 'powered') s += `<path class="usbcore" d="${d}" stroke-dasharray="${DASH[r.w.status]}"></path>`;
      if (r.w.usb === 'data') {
        // Just above the PC strip, clear of the lanes the cable crosses on its way down.
        const end = r.path[r.path.length - 1], mx = end.x, my = end.y - 18;
        s += `<rect class="usbtag" x="${mx - 26}" y="${my - 8}" width="52" height="16" rx="3"></rect><text class="via" x="${mx}" y="${my + 4}" text-anchor="middle">data only</text>`;
      }
      if (r.junction) s += `<circle class="dot" cx="${r.junction.x}" cy="${r.junction.y}" r="3.2" style="fill:${col};stroke:var(--muted);stroke-width:.8"></circle>`;
      if (r.cross) s += `<text x="${r.cross.x}" y="${r.cross.y + 4}" text-anchor="middle" style="fill:${col}">×</text>`;
      if (r.label) s += `<text x="${r.label.x}" y="${r.label.y}" text-anchor="${r.label.anchor}" style="fill:${col};font-size:10px">${esc(r.label.text)}</text>`;
      // A numbered diamond marks where a power rig relay will break the wire, and the rig contact that breaks it.
      if (r.w.cut) {
        const [p0, p1] = r.path, len = Math.hypot(p1.x - p0.x, p1.y - p0.y) || 1, t = Math.min(13, len / 2);
        const ux = (p1.x - p0.x) / len, uy = (p1.y - p0.y) / len;
        const c = r.label?.cut || { x: p0.x + ux * t, y: p0.y + uy * t };
        // Polarity dot beside the vertex on the side that goes to COM (com: "from" | "to").
        let dot = '', side = '';
        if (r.w.com) {
          const k = r.w.com === 'to' ? 8 : -8;
          dot = `<circle class="pol" cx="${c.x + ux * k - uy * 7}" cy="${c.y + uy * k + ux * 7}" r="2.4"></circle>`;
          side = `, COM on the ${r.w.com === 'to' ? endName(r.w) : r.w.from} side`;
        }
        s += `<g class="cut"><title>Power rig CH${r.w.cut} breaks this wire${esc(side)}</title><path d="M${c.x},${c.y - 8} L${c.x + 8},${c.y} L${c.x},${c.y + 8} L${c.x - 8},${c.y} Z"></path>`
          + `<text x="${c.x}" y="${c.y + 3.5}" text-anchor="middle">${r.w.cut}</text>${dot}</g>`;
      }
      if (r.w.via) {
        const [p1, p2] = r.path.length > 2 ? [r.path[1], r.path[2]] : [r.path[0], r.path[1]];
        const mx = (p1.x + p2.x) / 2, my = (p1.y + p2.y) / 2;
        s += `<rect x="${mx - 22}" y="${my - 8}" width="44" height="16" rx="3" style="fill:var(--panel);stroke:${col}"></rect><text class="via" x="${mx}" y="${my + 4}" text-anchor="middle">${esc(r.w.via)}</text>`;
      }
      s += `<path class="hit" d="${d}" data-i="${r.i}"></path>`;
    }
    for (const b of Object.values(B.boxes)) for (const side of ['top', 'bottom', 'left', 'right']) for (const t of b.d[side] || []) {
      if (!t) continue;
      const P = termPos(b, t);
      s += `<circle class="term" cx="${P.x}" cy="${P.y}" r="3"></circle>`;
    }
  }
  const sizing = fit ? `width="100%" style="min-width:900px"` : `width="${width}" height="${height}"`;
  $('diagram').innerHTML = `<svg viewBox="0 0 ${width} ${height}" ${sizing} role="img" aria-label="Bench wiring diagram">${s}</svg>`;
  document.querySelectorAll('.hit').forEach((h) => {
    const w = data.wires[h.dataset.i];
    h.onmousemove = (e) => {
      $('tip').style.display = 'block'; $('tip').style.left = e.clientX + 14 + 'px'; $('tip').style.top = e.clientY + 10 + 'px';
      $('tip').innerHTML = `<b>${esc(w.signal || '')}</b><br>${esc(w.from)} → ${esc(endName(w))}${w.via ? ' (via ' + esc(w.via) + ')' : ''}<br>${w.status}${w.note ? ' · ' + esc(w.note) : ''}`;
    };
    h.onmouseleave = () => { $('tip').style.display = 'none'; };
    h.onclick = () => select(+h.dataset.i);
  });
  chips(); todo();
}

function chips() {
  $('chips').innerHTML = STATUS.map((st) => {
    const n = data.wires.filter((w) => w.status === st).length;
    return `<span class="chip ${shown.has(st) ? '' : 'off'}" data-s="${st}" title="${esc(data.statuses[st])}">
      <svg width="26" height="8"><line x1="1" y1="4" x2="25" y2="4" stroke="var(--ink)" stroke-width="2.2" stroke-dasharray="${DASH[st]}"></line></svg>${st} ${n}</span>`;
  }).join(' ');
  document.querySelectorAll('.chip').forEach((c) => c.onclick = () => {
    shown.has(c.dataset.s) ? shown.delete(c.dataset.s) : shown.add(c.dataset.s); draw();
  });
}

// Outside the diagram a bus name needs its site ("LiPo" alone could be either).
function busName(id) {
  const b = data.buses.find((x) => x.id === id);
  return b && `${b.name} (${data.bands.find((x) => x.id === b.band)?.name || b.band})`;
}
function endName(w) { return w.to === 'pc' ? 'PC' : w.to || (w.bus && busName(w.bus)) || w.label || 'not connected'; }
function todo() {
  const items = data.wires.map((w, i) => ({ w, i })).filter(({ w }) => w.status === 'unverified' || w.status === 'planned');
  $('todo').innerHTML = `<h2>Still to settle (${items.length})</h2><ul>` + items.map(({ w, i }) =>
    `<li data-i="${i}"><span style="color:var(--${w.status})">${w.status}</span> · ${esc(w.signal || '')}: ${esc(w.from)} → ${esc(endName(w))}</li>`).join('') + '</ul>';
  document.querySelectorAll('#todo li').forEach((li) => li.onclick = () => select(+li.dataset.i));
}

function select(i) {
  selected = i;
  if (i === null) { $('panel').style.display = 'none'; draw(); return; }
  const w = data.wires[i];
  $('pSig').textContent = w.signal || 'Wire';
  $('pEnds').textContent = `${w.from} → ${endName(w)}${w.via ? ' (via ' + w.via + ')' : ''}`;
  $('pStatus').innerHTML = STATUS.map((st) => `<option${st === w.status ? ' selected' : ''}>${st}</option>`).join('');
  $('pNote').value = w.note || '';
  $('pColor').innerHTML = `<option value="">(not set: default)</option>` + Object.keys(WIRE).map((c) => `<option${c === w.color ? ' selected' : ''}>${c}</option>`).join('');
  $('pDesc').textContent = data.statuses[w.status] || '';
  $('panel').style.display = 'block';
  draw();
}
$('pStatus').onchange = () => { data.wires[selected].status = $('pStatus').value; $('pDesc').textContent = data.statuses[$('pStatus').value]; setDirty(true); draw(); };
$('pColor').onchange = () => { const w = data.wires[selected]; if ($('pColor').value) w.color = $('pColor').value; else delete w.color; setDirty(true); draw(); };
$('pNote').oninput = () => { data.wires[selected].note = $('pNote').value; setDirty(true); };
$('pClose').onclick = () => select(null);
// Clicking anywhere in the diagram but a wire drops the selection.
$('diagram').addEventListener('click', (e) => { if (selected !== null && !e.target.classList.contains('hit')) select(null); });

loadFetch();
</script>
</body>
</html>
