# Update proposals for what Dependabot can read: GitHub Actions (pinned by SHA), the web console's npm tooling and
# the Python environment (pyproject.toml, uv.lock). Arduino cores and libraries, arduino-cli, uv and gcovr are
# checked by the nightly deps-check routine (.claude/routines/deps-check.md) instead. Weekly, grouped, so a week's
# updates are one pull request per ecosystem; the cooldown leaves new releases two weeks to settle.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: CI

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      web-tooling:
        patterns: ['*']
    commit-message:
      prefix: Web tooling

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      python:
        patterns: ['*']
    commit-message:
      prefix: Python
