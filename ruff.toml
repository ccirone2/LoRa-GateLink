# Lint for the e2e suite and tools (CI: `ruff check tests tools`). Bug-finding rules only, no style: pyflakes (F),
# syntax/statement errors (E4/E7/E9) and bugbear (B).
target-version = "py310"
line-length = 120

[lint]
select = ["E4", "E7", "E9", "F", "B"]

# Not selected above; for `ruff check --select I --fix` (import order) only.
[lint.isort]
known-first-party = ["gatelink", "gatelink_client"]
