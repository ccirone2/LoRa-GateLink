[pytest]
# Bench end-to-end tests: need both boards, the GateSim Uno and Home Assistant (see tests/e2e/README.md).
addopts = -m "not soak and not longsoak and not rf" -ra
markers =
    soak: repeated open/close cycles with latency stats (select with -m soak)
    longsoak: hours-long run with outages and opener faults mixed in (select with -m longsoak)
    rf: real RF test, a marginal link at minimum power and SF12 (select with -m rf; see tests/e2e/README.md)
    needs_key: needs GATELINK_KEY (the link key both boards share); skipped otherwise
