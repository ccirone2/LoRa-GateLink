name: Deploy web console to Pages

on:
  workflow_dispatch:
  # Main, once CI has passed on it (lint, unit and browser tests), so a page that fails its tests is never
  # deployed; and again once a release has its .bin, so the page offers it.
  workflow_run:
    workflows: [CI, Release firmware binary]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # A CI run on a commit main has since moved past deploys nothing: the run on the newer commit will.
  latest:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.name == 'Release firmware binary' ||
        (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main')))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      deploy: ${{ steps.check.outputs.deploy }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NAME: ${{ github.event.workflow_run.name }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$RUN_NAME" = CI ]; then
            head=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
            if [ "$head" != "$SHA" ]; then
              echo "::notice::main has moved on to $head; the CI run on it deploys"
              exit 0
            fi
          fi
          echo "deploy=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: latest
    if: needs.latest.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Syntax check web console
        run: for f in web/app.js web/js/*.js; do node --check "$f"; done
      # The web console's "Install latest" flashes this copy: the page can't fetch release assets from
      # github.com itself (no CORS). Deployed only, never committed.
      - name: Bundle the latest release firmware
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName) || { echo "No release yet"; exit 0; }
          mkdir -p web/firmware
          if ! gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "GateLink-$tag.bin" --dir web/firmware; then
            echo "::warning::$tag has no GateLink-$tag.bin yet; the page offers file upload only"
            exit 0
          fi
          f="GateLink-$tag.bin"
          # Check it against the checksum published with the release (attached since v0.13.0), so a damaged or
          # swapped download isn't deployed with a checksum of its own.
          if gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$f.sha256" --dir "$RUNNER_TEMP"; then
            (cd web/firmware && sha256sum -c "$RUNNER_TEMP/$f.sha256")
          else
            echo "::warning::$tag has no $f.sha256 (released before v0.13.0); deploying it unchecked"
          fi
          printf '{"version":"%s","file":"%s","sha256":"%s","size":%d}\n' \
            "${tag#v}" "$f" "$(sha256sum "web/firmware/$f" | cut -d' ' -f1)" "$(stat -c %s "web/firmware/$f")" \
            > web/firmware/latest.json
          cat web/firmware/latest.json
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
